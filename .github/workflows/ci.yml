name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check license notices and the dependency ledger
        run: python3 tools/license/check_license.py
      - name: Check the public tree
        run: python3 tools/check_public_tree.py
      - name: Test the corpus tooling
        run: python3 -m unittest discover -s tools/corpus -p 'test_*.py' -v
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p catiakit-cli -- --help

  # Native-file regression on the public NIST corpus. The archives are pinned
  # by hash in tools/corpus/sources.json and are downloaded on each run; they
  # are not stored in the repository. Runs on the default branch, on manual
  # dispatch and weekly, so pull requests stay independent of nist.gov.
  corpus:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the optional JPEG decoder used by the metadata check
        run: python3 -m pip install --user "pillow>=10,<12"
      - name: Fetch and verify the pinned NIST archives
        run: |
          python3 tools/corpus/corpus.py fetch
          python3 tools/corpus/corpus.py verify
      - run: cargo build --workspace --bins --examples --locked
      - name: Container, metadata and document-property checks
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-reports"
          python3 tools/corpus/check_m2.py --output "$RUNNER_TEMP/corpus-reports/stream-check.json"
          python3 tools/corpus/check_m3.py --output "$RUNNER_TEMP/corpus-reports/metadata-check.json"
          python3 tools/corpus/check_document_properties.py --output "$RUNNER_TEMP/corpus-reports/document-check.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-reports
          path: ${{ runner.temp }}/corpus-reports/
          if-no-files-found: error
