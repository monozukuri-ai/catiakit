[workspace]
members = ["crates/catiakit-core", "crates/catiakit-cli"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/monozukuri-ai/catiakit"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
publish = false

[workspace.dependencies]
catiakit-core = { path = "crates/catiakit-core" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
